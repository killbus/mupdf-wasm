name: Build MuPDF WASM

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      mupdf_ref:
        description: 'MuPDF git ref (tag, branch, commit). Leave empty for latest.'
        required: false
        default: ''
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Determine MuPDF version to checkout
        id: mupdf_version
        run: |
          MANUAL_REF="${{ github.event.inputs.mupdf_ref }}"
          if [ -n "$MANUAL_REF" ]; then
            echo "Using manual ref: $MANUAL_REF"
            echo "ref=$MANUAL_REF" >> $GITHUB_OUTPUT
          else
            echo "Performing partial clone to fetch Git metadata..."
            git clone --filter=blob:none --bare https://github.com/ArtifexSoftware/mupdf.git mupdf_bare
            
            echo "Determining latest stable tag by creation date..."
            LATEST_TAG=$(cd mupdf_bare && git for-each-ref --sort=-creatordate --format='%(refname:short)' refs/tags | grep -vE -- '-rc|-beta' | head -n 1)
            
            echo "Latest stable tag is: $LATEST_TAG"
            echo "ref=$LATEST_TAG" >> $GITHUB_OUTPUT
          fi

      - name: Checkout MuPDF source code
        uses: actions/checkout@v4
        with:
          repository: ArtifexSoftware/mupdf
          ref: ${{ steps.mupdf_version.outputs.ref }}
          path: mupdf
          submodules: 'recursive'

      - name: Setup Emscripten SDK (emsdk)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 'latest'

      - name: Log files in wasm directory for verification
        working-directory: mupdf/platform/wasm
        run: ls -lR

      - name: Run official build script
        working-directory: mupdf/platform/wasm
        run: bash ./tools/build.sh

      - name: Prepare artifacts for release workflow
        run: |
          echo "${{ steps.mupdf_version.outputs.ref }}" > ./version.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mupdf-wasm-dist
          path: mupdf/platform/wasm/dist/
      
      - name: Upload Version Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mupdf-version
          path: version.txt