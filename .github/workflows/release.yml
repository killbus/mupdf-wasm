name: Release to Git Branch and Create GitHub Release

on:
  workflow_run:
    workflows: ["Build MuPDF WASM"]
    types:
      - completed
    branches:
      - main

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4
      - name: Download artifacts
        # ... (download script remains the same)
        uses: actions/github-script@v7
        with:
          script: |
            let allArtifacts = await github.rest.actions.listWorkflowRunArtifacts({ owner: context.repo.owner, repo: context.repo.repo, run_id: context.payload.workflow_run.id });
            let distArtifact = allArtifacts.data.artifacts.find(a => a.name === "mupdf-wasm-dist");
            let versionArtifact = allArtifacts.data.artifacts.find(a => a.name === "mupdf-version");
            let [distDownload, versionDownload] = await Promise.all([
              github.rest.actions.downloadArtifact({ owner: context.repo.owner, repo: context.repo.repo, artifact_id: distArtifact.id, archive_format: 'zip' }),
              github.rest.actions.downloadArtifact({ owner: context.repo.owner, repo: context.repo.repo, artifact_id: versionArtifact.id, archive_format: 'zip' })
            ]);
            let fs = require('fs');
            fs.writeFileSync(`${process.env.GITHUB_WORKSPACE}/mupdf-wasm-dist.zip`, Buffer.from(distDownload.data));
            fs.writeFileSync(`${process.env.GITHUB_WORKSPACE}/mupdf-version.zip`, Buffer.from(versionDownload.data));
      - run: unzip mupdf-wasm-dist.zip -d dist
      - run: unzip mupdf-version.zip

      - name: Generate and Push Release Branch
        id: generate_release
        run: |
          VERSION_REF=$(cat version.txt)
          echo "tag_name=${VERSION_REF}" >> $GITHUB_OUTPUT
          
          # Initialize a temporary, clean repository
          git init temp_release
          cd temp_release

          # Copy the build artifacts and package definition into it
          cp ../package.json .
          cp -r ../dist .
          
          # Configure Git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create a new commit with the release files
          git checkout -b release
          PACKAGE_VERSION=$(echo "$VERSION_REF" | sed 's/^v//')
          npm version $PACKAGE_VERSION --no-git-tag-version --allow-same-version
          git add .
          git commit -m "feat: release build from MuPDF $VERSION_REF"
          
          # Create a tag pointing to this exact commit
          git tag $VERSION_REF
          
          # Force push both the branch and the tag to the remote repository
          # This overwrites the old release branch and tag completely
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push --force origin release
          git push --force origin $VERSION_REF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.generate_release.outputs.tag_name }}
          generate_release_notes: true
          files: dist/*
